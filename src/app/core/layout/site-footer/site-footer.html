<footer class="site-footer">
  <div class="ep-container site-footer__inner">
    <div class="site-footer__brand">
      <p class="site-footer__name">{{ siteName }}</p>
      <p class="site-footer__tagline">{{ tagline }}</p>
    </div>

    <nav class="site-footer__nav" aria-label="Footer">
      <a routerLink="/">Home</a>
      <a routerLink="/frameworks">Frameworks</a>
      <a routerLink="/docs/angular">Documentation</a>
      <a routerLink="/security">Security</a>
      <a routerLink="/playground">Playground</a>
      <a [href]="githubUrl" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>

    <p class="site-footer__copy">
      © {{ year }} {{ siteName }}. Official ecosystem website. No payment processing on this site.
    </p>
  </div>
</footer>
