<ep-container>
  @if (resolved(); as page) {
    <div class="docs-viewer">
      <ep-docs-toolbar
        [frameworks]="frameworkOptions"
        [versions]="versionOptions()"
        [selectedFramework]="page.framework"
        [selectedVersion]="page.version"
        (frameworkChange)="onFrameworkChange($event)"
        (versionChange)="onVersionChange($event)"
        (searchClick)="openSearch()"
      />

      <div class="docs-viewer__mobile-nav">
        <button
          type="button"
          class="docs-viewer__mobile-toggle"
          [attr.aria-expanded]="mobileNavOpen()"
          aria-controls="docs-mobile-nav"
          (click)="toggleMobileNav()"
        >
          {{ mobileNavOpen() ? 'Hide' : 'Show' }} documentation menu
        </button>
        @if (mobileNavOpen()) {
          <div id="docs-mobile-nav">
            <ep-docs-sidebar
              [groups]="navGroups()"
              ariaLabel="Documentation sections"
            />
          </div>
        }
      </div>

      <ep-docs-shell>
        <ep-docs-sidebar
          docsSidebar
          class="docs-viewer__desktop-sidebar"
          [groups]="navGroups()"
          ariaLabel="Documentation sections"
        />

        <article docsMain class="docs-viewer__article">
          <ep-docs-page-header
            [eyebrow]="page.packageName + ' · v' + page.version"
            [title]="page.page.title"
            [description]="page.page.description"
          >
            @if (page.latestPublished) {
              <ep-badge variant="available">{{ page.version }}</ep-badge>
            } @else {
              <ep-badge variant="info">Published</ep-badge>
            }
          </ep-docs-page-header>

          <ep-docs-markdown
            [markdown]="page.page.markdown"
            [docsBasePath]="'/docs/' + page.framework + '/' + page.version"
            (tocChange)="onTocChange($event)"
          />

          <ep-docs-pager
            [previous]="
              page.previous
                ? { label: page.previous.title, href: page.previous.href }
                : null
            "
            [next]="
              page.next ? { label: page.next.title, href: page.next.href } : null
            "
          />

          <p class="docs-viewer__faq-link">
            <a routerLink="/faq">{{ t('nav.faq') }}</a>
          </p>

          <app-support-project-card />
        </article>

        <ep-docs-toc docsToc [items]="tocItems()" />
      </ep-docs-shell>
    </div>

    <app-docs-search-dialog
      [open]="searchOpen()"
      [query]="searchQuery()"
      [scope]="searchScope()"
      [hits]="searchHits()"
      [frameworkLabel]="page.frameworkName"
      [versionLabel]="page.version"
      (queryChange)="searchQuery.set($event)"
      (scopeChange)="searchScope.set($event)"
      (closed)="closeSearch()"
    />
  } @else {
    <section class="docs-missing" aria-labelledby="docs-missing-title">
      <ep-docs-page-header
        eyebrow="Documentation"
        [title]="
          missingReason() === 'coming-soon'
            ? 'Framework documentation coming soon'
            : 'Documentation page not found'
        "
        [description]="
          missingReason() === 'coming-soon'
            ? 'React, Vue, and Svelte adapters are not released yet. Angular documentation is available now.'
            : 'This framework, version, or page is not part of the documentation set.'
        "
      />

      <div class="docs-missing__actions">
        <a class="docs-missing__link" [routerLink]="latestHref()">
          Open latest Angular docs
        </a>
        <a class="docs-missing__link" routerLink="/frameworks">
          View framework status
        </a>
      </div>
    </section>
  }
</ep-container>
