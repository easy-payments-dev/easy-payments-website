<section class="ep-page security">
  <ep-container width="narrow">
    <ep-section-heading
      [eyebrow]="t('security.eyebrow')"
      [title]="t('security.title')"
      [description]="t('security.description')"
    />

    <ep-alert variant="security" [title]="t('security.alertTitle')">
      {{ t('security.alertBody') }}
    </ep-alert>

    <ul class="security-list">
      @for (item of principles(); track item.title) {
        <li>
          <ep-card variant="feature">
            <h2>{{ item.title }}</h2>
            <p>{{ item.body }}</p>
          </ep-card>
        </li>
      }
    </ul>

    <div class="security-links">
      <h2>{{ t('security.repoDocs.title') }}</h2>
      <p>{{ t('security.repoDocs.body') }}</p>
      <ep-button variant="outline" [href]="githubUrl" [external]="true">
        {{ t('security.githubCta') }}
      </ep-button>
    </div>
  </ep-container>
</section>
