<section class="ep-page not-found">
  <ep-container width="narrow">
    <ep-empty-state
      [eyebrow]="siteName"
      title="Page not found"
      description="That route is not part of the Easy Payments website yet. Head home or jump into frameworks and documentation."
      badgeLabel="404"
      badgeVariant="info"
    >
      <ep-button variant="primary" routerLink="/">Back home</ep-button>
      <ep-button variant="outline" routerLink="/frameworks">Frameworks</ep-button>
    </ep-empty-state>
  </ep-container>
</section>
