<section class="ep-page home">
  <ep-container width="narrow">
    <img
      class="home__logo"
      [src]="logoLockup"
      width="320"
      height="107"
      alt="Easy Payments — Payments Made Simple"
      decoding="async"
    />

    <ep-section-heading
      eyebrow="Official ecosystem website"
      [title]="siteName"
      [description]="description"
    >
      <p class="home__tagline">{{ tagline }}</p>
    </ep-section-heading>

    <div class="home__actions">
      <ep-button variant="primary" routerLink="/frameworks">Explore frameworks</ep-button>
      <ep-button variant="outline" routerLink="/docs/angular">Read documentation</ep-button>
    </div>

    <div class="home__panel">
      <ep-alert variant="info" title="Design system preview">
        Shared buttons, alerts, and code presentation are ready for the landing page and docs engine.
      </ep-alert>
      <ep-code-block language="bash" label="Install" [code]="installExample" />
    </div>
  </ep-container>
</section>
