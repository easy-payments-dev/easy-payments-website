<nav class="ep-docs-toc" [attr.aria-label]="resolvedTitle()">
  <p class="ep-docs-toc__title">{{ resolvedTitle() }}</p>
  <ol class="ep-docs-toc__list">
    @for (item of items(); track item.id) {
      <li>
        <a
          class="ep-docs-toc__link"
          [class.ep-docs-toc__link--active]="item.active"
          [href]="'#' + item.id"
        >
          {{ item.label }}
        </a>
      </li>
    }
  </ol>
</nav>
