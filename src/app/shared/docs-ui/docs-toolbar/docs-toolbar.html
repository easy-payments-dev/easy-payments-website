<div class="ep-docs-toolbar">
  <label class="ep-docs-toolbar__field">
    <span class="ep-docs-toolbar__label">{{ frameworkLabel() }}</span>
    <select
      (change)="onFrameworkChange($event)"
      [attr.aria-label]="frameworkAria()"
    >
      @for (option of frameworks(); track option.value) {
        <option
          [value]="option.value"
          [attr.selected]="option.value === selectedFramework() ? '' : null"
          [disabled]="option.disabled === true"
        >
          {{ option.label }}
        </option>
      }
    </select>
  </label>

  <label class="ep-docs-toolbar__field">
    <span class="ep-docs-toolbar__label">{{ versionLabel() }}</span>
    <select
      (change)="onVersionChange($event)"
      [attr.aria-label]="versionAria()"
    >
      @for (option of versions(); track option.value) {
        <option
          [value]="option.value"
          [attr.selected]="option.value === selectedVersion() ? '' : null"
          [disabled]="option.disabled === true"
        >
          {{ option.label }}
        </option>
      }
    </select>
  </label>

  <button
    type="button"
    class="ep-docs-toolbar__search"
    (click)="searchClick.emit()"
    [attr.aria-label]="resolvedSearchLabel()"
  >
    <span class="ep-docs-toolbar__search-text">{{ resolvedSearchLabel() }}</span>
    <kbd>Ctrl K</kbd>
  </button>
</div>
