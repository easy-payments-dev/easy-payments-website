<div class="ep-docs-toolbar">
  <label class="ep-docs-toolbar__field">
    <span class="ep-docs-toolbar__label">Framework</span>
    <select
      [value]="selectedFramework()"
      (change)="onFrameworkChange($event)"
      aria-label="Framework selector"
    >
      @for (option of frameworks(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled === true">
          {{ option.label }}
        </option>
      }
    </select>
  </label>

  <label class="ep-docs-toolbar__field">
    <span class="ep-docs-toolbar__label">Version</span>
    <select
      [value]="selectedVersion()"
      (change)="onVersionChange($event)"
      aria-label="Version selector"
    >
      @for (option of versions(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled === true">
          {{ option.label }}
        </option>
      }
    </select>
  </label>

  <button
    type="button"
    class="ep-docs-toolbar__search"
    (click)="searchClick.emit()"
    [attr.aria-label]="searchLabel()"
  >
    <span class="ep-docs-toolbar__search-text">{{ searchLabel() }}</span>
    <kbd>Ctrl K</kbd>
  </button>
</div>
