<nav class="ep-docs-pager" [attr.aria-label]="t('docs.pager.aria')">
  @if (previous(); as prev) {
    <a class="ep-docs-pager__link ep-docs-pager__link--prev" [routerLink]="prev.href">
      <span class="ep-docs-pager__direction">{{ t('docs.pager.previous') }}</span>
      <span class="ep-docs-pager__label">{{ prev.label }}</span>
    </a>
  } @else {
    <span></span>
  }

  @if (next(); as nxt) {
    <a class="ep-docs-pager__link ep-docs-pager__link--next" [routerLink]="nxt.href">
      <span class="ep-docs-pager__direction">{{ t('docs.pager.next') }}</span>
      <span class="ep-docs-pager__label">{{ nxt.label }}</span>
    </a>
  }
</nav>
